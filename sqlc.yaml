version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations"
    queries:
      - "db/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/gen/sql"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
        overrides:
          - db_type: "public.citext"
            go_type: "string"
          - db_type: "public.citext"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Text"
