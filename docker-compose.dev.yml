services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartulary
      POSTGRES_USER: cartulary
      POSTGRES_PASSWORD: cartulary
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./configs/dev/postgres-provision.sql:/docker-entrypoint-initdb.d/010-cartulary-provision.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartulary -d cartulary"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs-s3:
    image: docker.io/chrislusf/seaweedfs:4.17@sha256:186de7ef977a20343ee9a5544073f081976a29e2d29ecf8379891e7bf177fbe9
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.allowedOrigins=${OBJECT_STORE_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - -s3.port.iceberg=0
      - -webdav=false
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ACCESS_KEY_ID:-cartulary-local}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_S3_SECRET_ACCESS_KEY:-cartulary-local-secret}
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_UPSTREAM_PORT:-18333}:8333"
    volumes:
      - seaweedfs-s3-data:/data

volumes:
  postgres-data:
  seaweedfs-s3-data:
