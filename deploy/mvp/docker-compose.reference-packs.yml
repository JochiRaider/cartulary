# Optional overlay. Trust and incoming paths must already exist.
services:
  app:
    volumes:
      - type: bind
        source: ${CARTULARY_INSTALLATION_DIR:?installation required}/reference-pack-trust.json
        target: /etc/cartulary/reference-pack-trust.json
        read_only: true
        bind:
          create_host_path: false

  recovery-operator:
    volumes:
      - type: bind
        source: ${CARTULARY_INSTALLATION_DIR:?installation required}/reference-pack-trust.json
        target: /etc/cartulary/reference-pack-trust.json
        read_only: true
        bind:
          create_host_path: false

  restore-verify-operator:
    volumes:
      - type: bind
        source: ${CARTULARY_INSTALLATION_DIR:?installation required}/reference-pack-trust.json
        target: /etc/cartulary/reference-pack-trust.json
        read_only: true
        bind:
          create_host_path: false

  reference-pack-operator:
    profiles: [reference-pack-administration]
    image: ${CARTULARY_PACKAGE_APPLICATION_IMAGE:?immutable release required}
    pull_policy: never
    entrypoint: ["/usr/local/bin/cartulary-operator"]
    environment:
      CARTULARY_CONFIG_FILE: /etc/cartulary/config.toml
      CARTULARY_POSTGRES_PRIMARY_RUNTIME_DSN: postgresql://cartulary_runtime_login@postgres:5432/${POSTGRES_DB:-cartulary}?sslmode=verify-full&require_auth=none&sslrootcert=/etc/cartulary/tls/ca.pem&sslcert=/etc/cartulary/tls/pg.crt&sslkey=/etc/cartulary/tls/pg.key
    depends_on:
      app:
        condition: service_started
    volumes:
      - type: bind
        source: ${CARTULARY_TLS_DIR:?set CARTULARY_TLS_DIR}/ca.pem
        target: /etc/cartulary/tls/ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CARTULARY_TLS_DIR:?set CARTULARY_TLS_DIR}/runtime.crt
        target: /etc/cartulary/tls/pg.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CARTULARY_TLS_DIR:?set CARTULARY_TLS_DIR}/runtime.key
        target: /etc/cartulary/tls/pg.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CARTULARY_INSTALLATION_DIR:?installation required}/config.toml
        target: /etc/cartulary/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CARTULARY_INSTALLATION_DIR:?installation required}/reference-pack-trust.json
        target: /etc/cartulary/reference-pack-trust.json
        read_only: true
        bind:
          create_host_path: false
      - cartulary-reference-packs:/var/lib/cartulary/reference-packs
      - cartulary-tmp:/var/lib/cartulary/tmp
      - type: bind
        source: ${CARTULARY_INSTALLATION_DIR:?installation required}/reference-pack-incoming
        target: /var/lib/cartulary/reference-packs/incoming
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
