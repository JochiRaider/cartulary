        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TimelineQueryRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Timeline query response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimelineQueryEnvelope"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/incidents/{incident_id}/views/{view_schema_id}/rows": {
      "post": {
        "tags": [
          "workbook"
        ],
        "operationId": "createViewRow",
        "summary": "Create one row through the view-scoped row-create route for Timeline, Host, Identity, Indicator, Notes, Task Requests, or Decisions surfaces.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "$ref": "#/components/schemas/TimelineCreateRequest"
                  },
                  {
                    "$ref": "#/components/schemas/HostCreateRequest"
                  },
                  {
                    "$ref": "#/components/schemas/IdentityCreateRequest"
                  },
                  {
                    "$ref": "#/components/schemas/IndicatorCreateRequest"
                  },
                  {
                    "$ref": "#/components/schemas/NoteCreateRequest"
                  },
                  {
                    "$ref": "#/components/schemas/TaskRequestCreateRequest"
                  },
                  {
                    "$ref": "#/components/schemas/DecisionCreateRequest"
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created view row refresh",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ViewMutationEnvelope"
                }
              }
            }
          },
          "200": {
            "description": "Idempotent view row-create replay",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ViewMutationEnvelope"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/extensions": {
