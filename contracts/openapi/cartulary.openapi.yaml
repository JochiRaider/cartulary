{
  "openapi": "3.1.0",
  "info": {
    "title": "Cartulary Phase 3 Timeline Mutation HTTP Contract",
    "version": "0.3.0-phase3",
    "description": "Derived repo-local artifact from the owner docs chain. This file is not the behavioral authority."
  },
  "paths": {
    "/api/v1/auth/login": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "loginLocalUser",
        "summary": "Authenticate a local user and issue a base-profile session."
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "logoutCurrentSession",
        "summary": "Revoke the current session and clear the auth cookies."
      }
    },
    "/api/v1/auth/session": {
      "get": {
        "tags": [
          "auth"
        ],
        "operationId": "getCurrentSession",
        "summary": "Inspect the current session without sliding idle expiry."
      }
    },
    "/api/v1/auth/credential-state": {
      "get": {
        "tags": [
          "auth"
        ],
        "operationId": "getCredentialState",
        "summary": "Inspect local password and TOTP credential state for the current user."
      }
    },
    "/api/v1/auth/password/change": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "changeCurrentPassword",
        "summary": "Change the current user's password and revoke all active sessions."
      }
    },
    "/api/v1/auth/mfa/totp/begin": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "beginTOTPEnrollment",
        "summary": "Begin first-time or replacement TOTP enrollment using a bootstrap_token or an active session."
      }
    },
    "/api/v1/auth/mfa/totp/complete": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "completeTOTPEnrollment",
        "summary": "Complete TOTP enrollment using a bootstrap_token or an active session."
      }
    },
    "/api/v1/users": {
      "get": {
        "tags": [
          "deployment-users"
        ],
        "operationId": "listDeploymentUsers",
        "summary": "List deployment-scoped local users."
      },
      "post": {
        "tags": [
          "deployment-users"
        ],
        "operationId": "createDeploymentUser",
        "summary": "Create a deployment-scoped local user."
      }
    },
    "/api/v1/users/{user_id}": {
      "get": {
        "tags": [
          "deployment-users"
        ],
        "operationId": "getDeploymentUser",
        "summary": "Fetch a deployment-scoped local user by identifier."
      },
      "patch": {
        "tags": [
          "deployment-users"
        ],
        "operationId": "patchDeploymentUser",
        "summary": "Patch a deployment-scoped local user with optimistic version checks."
      }
    },
    "/api/v1/users/{user_id}/password/reset": {
      "post": {
        "tags": [
          "deployment-users"
        ],
        "operationId": "resetDeploymentUserPassword",
        "summary": "Reset a local user's password and revoke all active sessions."
      }
    },
    "/api/v1/users/{user_id}/mfa/totp/reset": {
      "post": {
        "tags": [
          "deployment-users"
        ],
        "operationId": "resetDeploymentUserTOTP",
        "summary": "Reset a local user's TOTP factor and reopen the bootstrap-token enrollment flow."
      }
    },
    "/api/v1/users/{user_id}/sessions/revoke-all": {
      "post": {
        "tags": [
          "deployment-users"
        ],
        "operationId": "revokeAllDeploymentUserSessions",
        "summary": "Explicitly revoke all sessions for a deployment-scoped local user."
      }
    },
    "/api/v1/incidents": {
      "get": {
        "tags": [
          "incidents"
        ],
        "operationId": "listVisibleIncidents",
        "summary": "List incidents for which the caller currently has membership."
      },
      "post": {
        "tags": [
          "incidents"
        ],
        "operationId": "createIncident",
        "summary": "Create an incident, bootstrap the creator admin membership, and bootstrap workbook preferences."
      }
    },
    "/api/v1/incidents/{incident_id}": {
      "get": {
        "tags": [
          "incidents"
        ],
        "operationId": "getIncident",
        "summary": "Fetch one visible incident by identifier."
      },
      "patch": {
        "tags": [
          "incidents"
        ],
        "operationId": "patchIncident",
        "summary": "Patch mutable incident metadata with optimistic incident_version checks."
      }
    },
    "/api/v1/incidents/{incident_id}/memberships": {
      "get": {
        "tags": [
          "incident-memberships"
        ],
        "operationId": "listIncidentMemberships",
        "summary": "List current memberships for one visible incident."
      },
      "post": {
        "tags": [
          "incident-memberships"
        ],
        "operationId": "createIncidentMembership",
        "summary": "Create or replay one incident membership without auto-inviting users."
      }
    },
    "/api/v1/incidents/{incident_id}/memberships/{user_id}": {
      "patch": {
        "tags": [
          "incident-memberships"
        ],
        "operationId": "patchIncidentMembership",
        "summary": "Patch an incident membership role with optimistic membership_version checks."
      },
      "delete": {
        "tags": [
          "incident-memberships"
        ],
        "operationId": "deleteIncidentMembership",
        "summary": "Delete an incident membership while preserving at least one incident admin."
      }
    },
    "/api/v1/incidents/{incident_id}/workbook-preferences/default": {
      "get": {
        "tags": [
          "workbook-preferences"
        ],
        "operationId": "getIncidentDefaultWorkbookPreferences",
        "summary": "Read the incident-wide default workbook preferences row."
      }
    },
    "/api/v1/incidents/{incident_id}/workbook-preferences/me": {
      "get": {
        "tags": [
          "workbook-preferences"
        ],
        "operationId": "getCurrentUserWorkbookPreferences",
        "summary": "Read the caller's per-incident workbook preferences row."
      }
    },
    "/api/v1/incidents/{incident_id}/views/{view_schema_id}/query": {
      "post": {
        "tags": [
          "timeline"
        ],
        "operationId": "queryTimelineView",
        "summary": "Query Timeline rows from the projection-backed Phase 3 workbook surface.",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TimelineQueryRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Timeline query response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimelineQueryEnvelope"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/incidents/{incident_id}/views/{view_schema_id}/rows": {
      "post": {
        "tags": [
          "timeline"
        ],
        "operationId": "createTimelineRow",
        "summary": "Create one Timeline row through the Phase 3 view-scoped row-create route.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TimelineCreateRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created Timeline row refresh",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimelineMutationEnvelope"
                }
              }
            }
          },
          "200": {
            "description": "Idempotent Timeline row-create replay",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimelineMutationEnvelope"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/extensions": {
      "get": {
        "tags": [
          "extensions"
        ],
        "operationId": "listDeploymentExtensions",
        "summary": "List the deployment-scoped reserved extension profiles and claimed route-family roots."
      }
    },
    "/api/v1/records/{record_id}": {
      "patch": {
        "tags": [
          "timeline"
        ],
        "operationId": "patchTimelineRecord",
        "summary": "Patch one Timeline row with optimistic row_version checks and idempotent replay.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RecordPatchRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Timeline patch response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimelineMutationEnvelope"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/records/{record_id}/mark-reviewed": {
      "post": {
        "tags": [
          "timeline"
        ],
        "operationId": "markTimelineRecordReviewed",
        "summary": "Explicitly transition a Timeline row to reviewed.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TimelineActionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Timeline action response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimelineActionEnvelope"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/records/{record_id}/supersede": {
      "post": {
        "tags": [
          "timeline"
        ],
        "operationId": "supersedeTimelineRecord",
        "summary": "Explicitly transition a Timeline row to superseded and optionally link a replacement row.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TimelineSupersedeRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Timeline supersede response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TimelineActionEnvelope"
                }
              }
            }
          }
        }
      }
    }
  },
