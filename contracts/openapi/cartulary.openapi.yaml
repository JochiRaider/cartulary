  },
  "paths": {
    "/api/v1/auth/login": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "loginLocalUser",
        "summary": "Authenticate a local user and issue a base-profile session."
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "logoutCurrentSession",
        "summary": "Revoke the current session and clear the auth cookies."
      }
    },
    "/api/v1/auth/session": {
      "get": {
        "tags": [
          "auth"
        ],
        "operationId": "getCurrentSession",
        "summary": "Inspect the current session without sliding idle expiry."
      }
    },
    "/api/v1/auth/credential-state": {
      "get": {
        "tags": [
          "auth"
        ],
        "operationId": "getCredentialState",
        "summary": "Inspect local password and TOTP credential state for the current user."
      }
    },
    "/api/v1/auth/password/change": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "changeCurrentPassword",
        "summary": "Change the current user's password and revoke all active sessions."
      }
    },
    "/api/v1/auth/mfa/totp/begin": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "beginTOTPEnrollment",
        "summary": "Begin first-time or replacement TOTP enrollment using a bootstrap_token or an active session."
      }
    },
    "/api/v1/auth/mfa/totp/complete": {
      "post": {
        "tags": [
          "auth"
        ],
        "operationId": "completeTOTPEnrollment",
